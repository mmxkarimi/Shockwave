plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
}

// Release signing: RELEASE_KEYSTORE_FILE / _PASSWORD / RELEASE_KEY_ALIAS / _PASSWORD from gradle properties or env.
// Without them the release APK is signed with the Android debug keystore (installable, but not a store key).
def releaseProp = { String name -> project.findProperty(name) ?: System.getenv(name) }
def releaseKeystore = releaseProp('RELEASE_KEYSTORE_FILE')

android {
    namespace 'ir.mmxkarimi.shockwave'
    compileSdkVersion 'android-37.0'

    defaultConfig {
        applicationId 'ir.mmxkarimi.shockwave'
        minSdk 29
        targetSdk 37
        versionCode = 7
        versionName = "0.5.0"
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseProp('RELEASE_KEYSTORE_PASSWORD')
                keyAlias releaseProp('RELEASE_KEY_ALIAS')
                keyPassword releaseProp('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }

    packaging {
        jniLibs {
            keepDebugSymbols += "**/libandroidx.graphics.path.so"
        }
    }

    lint {
        abortOnError true
        checkDependencies true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.activity.compose
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.material

    // Jetpack Compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.compose.runtime.livedata
    debugImplementation libs.compose.ui.tooling

    implementation libs.media3.exoplayer
    implementation libs.media3.session
}
