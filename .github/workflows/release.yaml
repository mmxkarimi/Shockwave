name: Build and Release Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # app/build.gradle reads these RELEASE_* names via releaseProp() (gradle property or env).
      RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/app/release.jks
      RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_count=$(grep -c '^VERSION_NAME=' gradle.properties || true)
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties | tr -d '\r')

          if [[ "$version_count" != "1" || -z "$version" || "$version" == *$'\n'* ]]; then
            echo "::error::Expected exactly one nonempty VERSION_NAME in gradle.properties"
            exit 1
          fi

          git check-ref-format "refs/tags/$version"
          printf 'name=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          # app/build.gradle uses compileSdkVersion 'android-37.0' / targetSdk 37.
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${RELEASE_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS}"
          : "${RELEASE_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD}"

          umask 077
          mkdir -p "$(dirname "$RELEASE_KEYSTORE_FILE")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          test -s "$RELEASE_KEYSTORE_FILE"

      - name: Build release APK
        run: bash ./gradlew --no-daemon -PappVersionName="${{ steps.version.outputs.name }}" assembleRelease

      - name: Check release APK exists
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/app-release.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APK found"
            exit 1
          fi

      - name: Rename release APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Shockwave-v${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/Shockwave-v${{ steps.version.outputs.name }}.apk

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "$RELEASE_KEYSTORE_FILE"
